<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio en Línea - Universal</title>
<style>
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .radio-container {
    width: 100%;
    max-width: 500px;
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Cabecera */
  .radio-header {
    text-align: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 12px;
  }
  .radio-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 4px 0;
  }
  .radio-subtitle {
    font-size: 0.85rem;
    color: #666;
    margin: 0;
  }

  /* Reproductor principal */
  .player-box {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .station-name {
    font-size: 1rem;
    font-weight: 600;
    color: #2c3e50;
    word-break: break-word;
  }
  .player-controls {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .btn-main {
    flex: 2;
    background: #0066cc;
    color: white;
    border: none;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-main:hover { background: #0052a3; }
  
  .btn-fav-action {
    flex: 1;
    background: #fff;
    color: #e67e22;
    border: 2px solid #e67e22;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-fav-action:hover {
    background: #fdf3e6;
  }

  /* Controles de Búsqueda y Filtros */
  .search-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .label-text {
    font-size: 0.85rem;
    font-weight: 600;
    color: #444;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  .form-control {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }
  .form-control:focus { border-color: #0066cc; }

  .btn-search {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 10px 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-search:hover { background: #27ae60; }

  /* Lista de estaciones */
  .station-list {
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    background: #fff;
  }
  .station-item {
    padding: 10px 12px;
    font-size: 0.9rem;
    border-bottom: 1px solid #f1f3f5;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .station-item:hover { background: #f1f3f5; }

  /* Sección de Favoritos */
  .favorites-section {
    border-top: 1px solid #eee;
    padding-top: 12px;
  }
  .favorites-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: #444;
    margin-bottom: 8px;
  }
  .favorites-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
  }
  .fav-card {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    padding: 8px 12px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
  }
  .fav-card-name {
    cursor: pointer;
    font-weight: 500;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fav-card-name:hover { color: #0066cc; }
  .btn-delete {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="radio-container">
    <div class="radio-header">
      <h1 class="radio-title">Radio en Línea</h1>
      <p class="radio-subtitle">Escucha emisoras de todo el mundo fácilmente</p>
    </div>

    <!-- Reproductor Actual -->
    <div class="player-box">
      <div class="station-name" id="current-station-label">Selecciona una emisora de la lista o tus favoritos</div>
      <div class="player-controls">
        <button class="btn-main" id="play-btn" onclick="togglePlay()">Reproducir</button>
        <button class="btn-fav-action" onclick="agregarAFavoritos()">⭐ Guardar</button>
      </div>
    </div>

    <!-- Buscador y selector de país -->
    <div class="search-box">
      <span class="label-text">Buscar emisora o país:</span>
      <div class="input-row">
        <select class="form-control" id="country-select" onchange="buscarPorPais()">
          <option value="Argentina">🇦🇷 Argentina</option>
          <option value="Spain">🇪🇸 España</option>
          <option value="Mexico">🇲🇽 México</option>
          <option value="United States">🇺🇸 Estados Unidos</option>
          <option value="Colombia">🇨🇴 Colombia</option>
          <option value="Chile">🇨🇱 Chile</option>
        </select>
        <input type="text" id="search-input" class="form-control" placeholder="Ej: La 100, Pop..." onkeypress="if(event.key==='Enter') buscarPorTexto()">
        <button class="btn-search" onclick="buscarPorTexto()">Buscar</button>
      </div>
    </div>

    <!-- Lista de Resultados -->
    <div class="station-list" id="station-list">
      <div class="station-item" style="color: #888; justify-content: center;">Elija un país o escriba un nombre arriba</div>
    </div>

    <!-- Mis Favoritos -->
    <div class="favorites-section">
      <div class="favorites-title">⭐ Mis Emisoras Favoritas</div>
      <div class="favorites-list" id="favorites-list">
        <!-- Cargado por JS -->
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const stationLabel = document.getElementById('current-station-label');
    
    let currentUrl = '';
    let currentName = '';
    
    // Almacenamiento local para los favoritos que el usuario agregue manualmente
    let favoritos = JSON.parse(localStorage.getItem('user_radio_favs')) || [];
    renderizarFavoritos();

    // Cargar emisoras de Argentina por defecto al abrir la página
    buscarPorPais();

    function buscarPorPais() {
      const pais = document.getElementById('country-select').value;
      stationLabel.textContent = `Buscando emisoras en ${pais}...`;

      fetch(`https://de1.api.radio-browser.info/json/stations/bycountry/${encodeURIComponent(pais)}?hidebroken=true&order=clickcount&reverse=true`)
        .then(res => res.json())
        .then(data => {
          const seguras = data.filter(s => s.url_resolved && s.url_resolved.startsWith('https://')).slice(0, 30);
          mostrarResultados(seguras);
        })
        .catch(() => {
          stationLabel.textContent = "Error al conectar con el servidor de radios.";
        });
    }

    function buscarPorTexto() {
      const texto = document.getElementById('search-input').value.trim();
      if (!texto) return;
      stationLabel.textContent = `Buscando "${texto}"...`;

      fetch(`https://de1.api.radio-browser.info/json/stations/byname/${encodeURIComponent(texto)}?hidebroken=true`)
        .then(res => res.json())
        .then(data => {
          const seguras = data.filter(s => s.url_resolved && s.url_resolved.startsWith('https://')).slice(0, 30);
          mostrarResultados(seguras);
        })
        .catch(() => {
          stationLabel.textContent = "Error en la búsqueda.";
        });
    }

    function mostrarResultados(stations) {
      const lista = document.getElementById('station-list');
      lista.innerHTML = '';

      if (stations.length === 0) {
        lista.innerHTML = '<div class="station-item" style="color:#888; justify-content:center;">No se encontraron emisoras.</div>';
        return;
      }

      stations.forEach(station => {
        const div = document.createElement('div');
        div.className = 'station-item';
        div.innerHTML = `
          <span>📻 <b>${station.name}</b></span>
          <span style="color: #0066cc; font-size: 0.8rem; font-weight:600;">Escuchar</span>
        `;
        div.onclick = () => sintonizar(station.url_resolved, station.name);
        lista.appendChild(div);
      });
      stationLabel.textContent = `${stations.length} emisoras encontradas. Haz clic en una para escuchar.`;
    }

    function sintonizar(url, name) {
      currentUrl = url;
      currentName = name;
      stationLabel.textContent = `Reproduciendo: ${name}`;
      audio.src = url;
      audio.play().then(() => {
        playBtn.textContent = 'Pausar';
      }).catch(() => {
        alert("El navegador bloqueó la reproducción automática o la radio no está disponible.");
      });
    }

    function togglePlay() {
      if (!currentUrl) {
        alert("Primero selecciona una emisora de la lista.");
        return;
      }
      if (audio.paused) {
        audio.play();
        playBtn.textContent = 'Pausar';
      } else {
        audio.pause();
        playBtn.textContent = 'Reproducir';
      }
    }

    function agregarAFavoritos() {
      if (!currentUrl || !currentName) {
        alert("Sintoniza una emisora primero para poder guardarla.");
        return;
      }
      // Verificar si ya existe
      if (!favoritos.some(f => f.url === currentUrl)) {
        favoritos.push({ name: currentName, url: currentUrl });
        localStorage.setItem('user_radio_favs', JSON.stringify(favoritos));
        renderizarFavoritos();
        alert(`¡"${currentName}" se guardó en tus favoritos!`);
      } else {
        alert("Esta emisora ya está guardada en tus favoritos.");
      }
    }

    function eliminarFavorito(index, event) {
      event.stopPropagation();
      favoritos.splice(index, 1);
      localStorage.setItem('user_radio_favs', JSON.stringify(favoritos));
      renderizarFavoritos();
    }

    function renderizarFavoritos() {
      const contenedor = document.getElementById('favorites-list');
      contenedor.innerHTML = '';

      if (favoritos.length === 0) {
        contenedor.innerHTML = '<div style="font-size: 0.8rem; color: #888; text-align: center; padding: 10px;">No tienes favoritos guardados todavía. Usa el botón "⭐ Guardar".</div>';
        return;
      }

      favoritos.forEach((fav, index) => {
        const card = document.createElement('div');
        card.className = 'fav-card';
        card.innerHTML = `
          <span class="fav-card-name" title="${fav.name}">⭐ ${fav.name}</span>
          <button class="btn-delete" title="Eliminar favorito" onclick="eliminarFavorito(${index}, event)">×</button>
        `;
        card.onclick = () => sintonizar(fav.url, fav.name);
        contenedor.appendChild(card);
      });
    }
  </script>
</body>
</html>
